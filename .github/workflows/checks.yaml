name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package
        run: |
          python3 scripts/validate.py
          node scripts/build.js
          git diff --exit-code -- dist/ha-custom-dashboards.js
          node --check dist/ha-custom-dashboards.js
          node --test tests/*.js
