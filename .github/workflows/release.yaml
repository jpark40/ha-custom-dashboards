name: Publish release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package
        run: |
          python3 scripts/validate.py
          node scripts/build.js
          git diff --exit-code -- dist/ha-custom-dashboards.js
          node --check dist/ha-custom-dashboards.js
          node --test tests/*.js
      - name: Publish current version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_version="$(cat VERSION)"
          gh release create "v$release_version" --target "$GITHUB_SHA" --generate-notes --title "v$release_version"
