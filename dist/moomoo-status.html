<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Moo Moo Status</title>

  <link rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css">

  <style>
    :root {
      color-scheme: dark;
      --bg: #111;
      --fg: #fff;
      --muted: #b9b9b9;
      --panel: #1b1b1b;
      --border: #3a3a3a;
      --accent: #4b8cff;
      --danger: #ff7b72;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    #page {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
    }

    #header {
      display: none;
      padding:
        max(12px, env(safe-area-inset-top))
        16px 14px;
      text-align: center;
      background: var(--bg);
      z-index: 5;
    }

    #title {
      margin: 0;
      font-size: clamp(38px, 5.8vw, 66px);
      line-height: 1.05;
      font-weight: 800;
    }

    #distance {
      margin-top: 8px;
      font-size: clamp(30px, 4.7vw, 54px);
      line-height: 1.08;
      font-weight: 800;
    }

    #map-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: none;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 100;
      background: var(--bg);
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 700;
      text-align: center;
    }

    #loading-screen.hidden { display: none; }


    #home-screen {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      text-align: center;
      z-index: 20;
    }

    #home-screen .home-title {
      font-size: clamp(48px, 8vw, 96px);
      line-height: 1.08;
      font-weight: 800;
    }

    #setup-screen {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      z-index: 90;
      background: var(--bg);
    }

    #setup {
      width: min(680px, 100%);
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
    }

    #setup h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    #setup p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    #setup label {
      display: block;
      margin: 16px 0 7px;
      font-size: 18px;
      font-weight: 700;
    }

    #setup input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #101010;
      color: white;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      padding: 12px 17px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary { background: #333; }

    #setup-status {
      min-height: 23px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
    }

    #setup-status.error { color: var(--danger); }

    #map-status {
      display: none;
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,.76);
      color: white;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }

    #map-status.show { display: block; }

    .moomoo-marker {
      width: 92px;
      height: 58px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
    }

    .moomoo-marker img {
      width: 92px;
      height: 58px;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    #gear {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: none;
      place-items: center;
      z-index: 120;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: white;
      font-size: 22px;
    }
  
    .cow-icon {
      display: inline-block;
      width: 1.05em;
      height: 1.05em;
      vertical-align: -0.12em;
    }

    .cow-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

  <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>

  <script>
    const ENTITIES = {
      location: "device_tracker.2026_ioniq_9_location",
      home: "zone.home"
    };

    const MAP_STYLE =
      "https://tiles.openfreemap.org/styles/liberty";

    const ORS_DIRECTIONS =
      "https://api.heigit.org/openrouteservice/v2/directions/driving-car/geojson";


    // Reuse the routing key already stored by mousie-status.html.
    const ORS_STORAGE = "mousieStatusOrsKey";

    // Own HA auth storage. We can also reuse Mousie's HA authorization if
    // that page has already been authorized in this same browser.
    const AUTH_STORAGE = "hacsMoomooStatusHaAuth";
    const MOUSE_AUTH_STORAGE = "hacsMousieStatusHaAuth";

    const CLIENT_ID = location.origin + location.pathname;
    const REDIRECT_URI = CLIENT_ID;
    const MOUSE_CLIENT_ID =
      location.origin + "/local/community/ha-custom-dashboards/mousie-status.html";

    const LOCATION_ENTITY = ENTITIES.location;

    const DISTANCE_REFRESH_MIN_MS = 15000;
    const DISTANCE_REFRESH_MOVE_METERS = 50;

    const loadingScreen = document.getElementById("loading-screen");
    const setupScreen = document.getElementById("setup-screen");
    const homeScreen = document.getElementById("home-screen");
    const setupStatus = document.getElementById("setup-status");
    const orsInput = document.getElementById("ors-key");
    const header = document.getElementById("header");
    const mapWrap = document.getElementById("map-wrap");
    const distanceEl = document.getElementById("distance");
    const mapStatus = document.getElementById("map-status");
    const gear = document.getElementById("gear");

    let accessToken = null;
    let states = new Map();

    let map = null;
    let mapLoaded = false;
    let carMarker = null;

    let currentCoords = null;
    let currentAddress = null;
    let locationRevision = 0;

    let lastRoutePoint = null;
    let lastRouteAt = 0;
    let lastDistanceMiles = null;
    let routeInFlight = false;
    let routeQueued = false;

    let websocket = null;
    let reconnectTimer = null;

    orsInput.value = localStorage.getItem(ORS_STORAGE) || "";

    // Give Android/Fully hardware Back something to pop.
    if (!history.state?.moomoo_status) {
      history.replaceState({ moomoo_base: true }, "", location.href);
      history.pushState({ moomoo_status: true }, "", location.href);
    }

    window.addEventListener("popstate", () => {
      window.location.href = "fully://launcher";
    }, { once: true });

    function hideLoading() {
      loadingScreen.classList.add("hidden");
    }

    function setMapStatus(message) {
      mapStatus.textContent = message || "";
      mapStatus.classList.toggle("show", Boolean(message));
    }

    function setSetupStatus(message, error = false) {
      setupStatus.textContent = message || "";
      setupStatus.classList.toggle("error", error);
    }

    function showSetup(message = "") {
      hideLoading();
      homeScreen.style.display = "none";
      header.style.display = "none";
      mapWrap.style.display = "none";
      gear.style.display = "none";
      setupScreen.style.display = "grid";
      setSetupStatus(message);
    }

    function showHome() {
      hideLoading();
      setupScreen.style.display = "none";
      header.style.display = "none";
      mapWrap.style.display = "none";
      homeScreen.style.display = "grid";
      gear.style.display = "grid";
      setMapStatus("");
    }

    function showMain() {
      hideLoading();
      homeScreen.style.display = "none";
      setupScreen.style.display = "none";
      header.style.display = "block";
      mapWrap.style.display = "block";
      gear.style.display = "grid";
      if (map) setTimeout(() => map.resize(), 0);
    }

    function readStored(name) {
      try {
        return JSON.parse(localStorage.getItem(name) || "null");
      } catch (_) {
        return null;
      }
    }

    function saveStored(name, value) {
      localStorage.setItem(name, JSON.stringify(value));
    }

    async function exchangeAuthorizationCode(code) {
      const body = new URLSearchParams({
        grant_type: "authorization_code",
        code,
        client_id: CLIENT_ID
      });

      const response = await fetch("/auth/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body
      });

      if (!response.ok) {
        throw new Error(`HA authorization failed (${response.status})`);
      }

      const tokens = await response.json();

      saveStored(AUTH_STORAGE, {
        access_token: tokens.access_token,
        refresh_token: tokens.refresh_token,
        expires_at: Date.now() + tokens.expires_in * 1000
      });

      history.replaceState({ moomoo_status: true }, "", REDIRECT_URI);
    }

    async function refreshStoredAuth(storageName, clientId) {
      const auth = readStored(storageName);
      if (!auth?.refresh_token) return null;

      const body = new URLSearchParams({
        grant_type: "refresh_token",
        refresh_token: auth.refresh_token,
        client_id: clientId
      });

      const response = await fetch("/auth/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body
      });

      if (!response.ok) return null;

      const data = await response.json();

      const updated = {
        ...auth,
        access_token: data.access_token,
        expires_at: Date.now() + data.expires_in * 1000
      };

      saveStored(storageName, updated);
      return updated.access_token;
    }

    async function getAccessToken() {
      // Prefer this page's own authorization.
      let token = await refreshStoredAuth(AUTH_STORAGE, CLIENT_ID);
      if (token) return token;

      // If Mousie was already authorized in this browser, reuse its refresh
      // token using the Mousie OAuth client ID.
      token = await refreshStoredAuth(MOUSE_AUTH_STORAGE, MOUSE_CLIENT_ID);
      if (token) return token;

      return null;
    }

    function startAuthorization() {
      const authUrl = new URL("/auth/authorize", location.origin);
      authUrl.searchParams.set("client_id", CLIENT_ID);
      authUrl.searchParams.set("redirect_uri", REDIRECT_URI);
      authUrl.searchParams.set("state", "moomoo-status");
      location.href = authUrl.toString();
    }

    async function getAllStates() {
      const response = await fetch("/api/states", {
        cache: "no-store",
        headers: {
          "Authorization": `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(`Could not read HA states (HTTP ${response.status})`);
      }

      return response.json();
    }

    function numeric(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function usableState(value) {
      const text = String(value ?? "").trim();
      return (
        text &&
        !["unknown", "unavailable", "none", "null"].includes(text.toLowerCase())
      );
    }

    function coordsFromAttributes(state) {
      if (!state) return null;
      const a = state.attributes || {};

      const lat =
        numeric(a.latitude) ??
        numeric(a.lat) ??
        numeric(a.location_latitude);

      const lon =
        numeric(a.longitude) ??
        numeric(a.lon) ??
        numeric(a.lng) ??
        numeric(a.location_longitude);

      if (lat !== null && lon !== null) {
        return { lat, lon };
      }

      // A few integrations expose coordinates as a 2-element array.
      if (Array.isArray(a.coordinates) && a.coordinates.length >= 2) {
        const first = numeric(a.coordinates[0]);
        const second = numeric(a.coordinates[1]);

        if (first !== null && second !== null) {
          // Prefer [lon,lat] GeoJSON order when it looks plausible.
          if (Math.abs(first) <= 180 && Math.abs(second) <= 90) {
            return { lat: second, lon: first };
          }
        }
      }

      return null;
    }

    function coordsFromText(text) {
      if (!usableState(text)) return null;

      const match = String(text).match(
        /(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)/ 
      );

      if (!match) return null;

      const lat = numeric(match[1]);
      const lon = numeric(match[2]);

      if (
        lat !== null && lon !== null &&
        Math.abs(lat) <= 90 && Math.abs(lon) <= 180
      ) {
        return { lat, lon };
      }

      return null;
    }

    async function geocodeAddress(address) {
      const key = localStorage.getItem(ORS_STORAGE);
      if (!key) throw new Error("No HeiGIT API key saved.");

      const url = new URL(PELIAS_SEARCH);
      url.searchParams.set("text", address);
      url.searchParams.set("size", "1");

      const response = await fetch(url.toString(), {
        cache: "no-store",
        headers: {
          "Authorization": key
        }
      });

      if (!response.ok) {
        throw new Error(`Geocoding failed (HTTP ${response.status})`);
      }

      const data = await response.json();
      const coords = data.features?.[0]?.geometry?.coordinates;

      if (!Array.isArray(coords) || coords.length < 2) {
        throw new Error("No coordinates found for Moo Moo's geocoded location.");
      }

      return {
        lon: numeric(coords[0]),
        lat: numeric(coords[1])
      };
    }

    async function resolveLocation(state, revision) {
      const coords = coordsFromAttributes(state);

      if (!coords) {
        throw new Error(
          "Moo Moo GPS coordinates are unavailable from " + LOCATION_ENTITY
        );
      }

      return coords;
    }

    function homeCoords() {
      return coordsFromAttributes(states.get(ENTITIES.home));
    }

    function distanceMeters(aLat, aLon, bLat, bLon) {
      const R = 6371000;
      const rad = d => d * Math.PI / 180;
      const dLat = rad(bLat - aLat);
      const dLon = rad(bLon - aLon);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(aLat)) *
        Math.cos(rad(bLat)) *
        Math.sin(dLon / 2) ** 2;

      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function isHome(coords) {
      const homeState = states.get(ENTITIES.home);
      const home = homeCoords();
      if (!home || !coords) return false;

      const radius = numeric(homeState?.attributes?.radius) ?? 100;

      return distanceMeters(
        coords.lat, coords.lon,
        home.lat, home.lon
      ) <= radius;
    }

    function formatMiles(miles) {
      if (!Number.isFinite(miles)) return "—";
      if (miles < 0.1) return "<0.1 mi";
      if (miles < 100) return `${miles.toFixed(1)} mi`;
      return `${Math.round(miles)} mi`;
    }

        style: MAP_STYLE,
        center: [coords.lon, coords.lat],
        zoom: 15,
        attributionControl: true
      });

      map.addControl(
        new maplibregl.NavigationControl({
          showCompass: false
        }),
        "bottom-right"
      );

      map.on("load", () => {
        mapLoaded = true;
        map.resize();
        updateMarker(currentCoords, false);
      });
    }

    function updateMarker(coords, animate = true) {
      if (!coords) return;

      ensureMap(coords);

      if (!carMarker) {
        carMarker = new maplibregl.Marker({
          element: createCarElement(),
          anchor: "center"
        })
          .setLngLat([coords.lon, coords.lat])
          .addTo(map);
      } else {
        carMarker.setLngLat([coords.lon, coords.lat]);
      }

      if (mapLoaded) {
        map.easeTo({
          center: [coords.lon, coords.lat],
          duration: animate ? 900 : 0,
          essential: true
        });
      }
    }

    async function drivingDistanceMeters(from, to) {
      const key = localStorage.getItem(ORS_STORAGE);
      if (!key) throw new Error("No HeiGIT API key saved.");

      const response = await fetch(ORS_DIRECTIONS, {
        method: "POST",
        cache: "no-store",
        headers: {
          "Authorization": key,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          coordinates: [
            [from.lon, from.lat],
            [to.lon, to.lat]
          ]
        })
      });

      if (!response.ok) {
        const detail = await response.text().catch(() => "");
        throw new Error(
          `Route distance failed (HTTP ${response.status})` +
          (detail ? `: ${detail.substring(0, 100)}` : "")
        );
      }

      const data = await response.json();
      const meters = numeric(data.features?.[0]?.properties?.summary?.distance);

      if (meters === null) {
        throw new Error("Route distance was not returned.");
      }

      return meters;
    }

    function routeDistanceNeedsRefresh(coords) {
      if (!lastRoutePoint) return true;

      const moved = distanceMeters(
        coords.lat, coords.lon,
        lastRoutePoint.lat, lastRoutePoint.lon
      );

      return (
        moved >= DISTANCE_REFRESH_MOVE_METERS &&
        Date.now() - lastRouteAt >= DISTANCE_REFRESH_MIN_MS
      );
    }

    async function refreshDistanceToHome(coords, force = false) {
      const home = homeCoords();

      if (!home) {
        distanceEl.textContent = "🏠 Home location unavailable";
        return;
      }

      if (isHome(coords)) {
        distanceEl.textContent = "🏠 Moo Moo is home";
        lastDistanceMiles = 0;
        return;
      }

      if (!force && !routeDistanceNeedsRefresh(coords)) {
        if (lastDistanceMiles !== null) {
          distanceEl.textContent =
            `🏠 Driving distance home: ${formatMiles(lastDistanceMiles)}`;
        }
        return;
      }

      if (routeInFlight) {
        routeQueued = true;
        return;
      }

      routeInFlight = true;
      distanceEl.textContent = "🏠 Calculating driving distance home…";

      try {
        const meters = await drivingDistanceMeters(coords, home);
        const miles = meters / 1609.344;

        lastDistanceMiles = miles;
        lastRoutePoint = { ...coords };
        lastRouteAt = Date.now();

        distanceEl.textContent =
          `🏠 Driving distance home: ${formatMiles(miles)}`;

        setMapStatus("");
      } catch (error) {
        console.error(error);
        distanceEl.textContent = "🏠 Driving distance unavailable";
        setMapStatus(error.message);
      } finally {
        routeInFlight = false;

        if (routeQueued) {
          routeQueued = false;
          if (currentCoords) refreshDistanceToHome(currentCoords, true);
        }
      }
    }

    async function processLocationState(state, forceDistance = false) {
      const revision = ++locationRevision;

      try {
        const coords = await resolveLocation(state, revision);
        if (!coords || revision !== locationRevision) return;

        if (
          coords.lat === null || coords.lon === null ||
          !Number.isFinite(coords.lat) || !Number.isFinite(coords.lon)
        ) {
          throw new Error("Moo Moo coordinates are invalid.");
        }

        const moved =
          !currentCoords ||
          distanceMeters(
            coords.lat, coords.lon,
            currentCoords.lat, currentCoords.lon
          ) > 1;

        currentCoords = coords;

        // Match mousie-status.html: at Home, hide the map completely.
        if (isHome(coords)) {
          showHome();
          return;
        }

        showMain();
        updateMarker(coords, moved);
        setMapStatus("");

        await refreshDistanceToHome(coords, forceDistance);
      } catch (error) {
        console.error(error);
        showMain();
        distanceEl.textContent = "🏠 Distance unavailable";
        setMapStatus(error.message);
      }
    }

    async function loadInitialState() {
      const all = await getAllStates();
      all.forEach(item => states.set(item.entity_id, item));

      const locationState = states.get(LOCATION_ENTITY);

      if (!locationState) {
        throw new Error(`Entity not found: ${LOCATION_ENTITY}`);
      }

      await processLocationState(locationState, true);
    }

    function websocketUrl() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      return `${protocol}//${location.host}/api/websocket`;
    }

    function connectWebSocket() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      websocket = new WebSocket(websocketUrl());
      let commandId = 1;

      websocket.addEventListener("message", async event => {
        const message = JSON.parse(event.data);

        if (message.type === "auth_required") {
          const token = await getAccessToken();

          if (!token) {
            websocket.close();
            showSetup("Home Assistant authorization expired. Reconnect once.");
            return;
          }

          accessToken = token;
          websocket.send(JSON.stringify({
            type: "auth",
            access_token: token
          }));
          return;
        }

        if (message.type === "auth_ok") {
          websocket.send(JSON.stringify({
            id: commandId++,
            type: "subscribe_events",
            event_type: "state_changed"
          }));
          return;
        }

        if (message.type === "auth_invalid") {
          localStorage.removeItem(AUTH_STORAGE);
          websocket.close();
          showSetup("Home Assistant authorization expired. Reconnect once.");
          return;
        }

        if (message.type !== "event") return;

        const data = message.event?.data;
        const entityId = data?.entity_id;
        const newState = data?.new_state;

        if (!entityId) return;

        if (newState) {
          states.set(entityId, newState);
        } else {
          states.delete(entityId);
        }

        if (entityId === LOCATION_ENTITY && newState) {
          // Live behavior: whenever HA receives a new Moo Moo location,
          // move the marker and recenter the map.
          await processLocationState(newState, false);
        }

        if (entityId === ENTITIES.home && currentCoords) {
          if (isHome(currentCoords)) {
            showHome();
          } else {
            showMain();
            updateMarker(currentCoords, false);
            await refreshDistanceToHome(currentCoords, true);
          }
        }
      });

      websocket.addEventListener("close", () => {
        reconnectTimer = setTimeout(connectWebSocket, 5000);
      });

      websocket.addEventListener("error", () => {
        try { websocket.close(); } catch (_) {}
      });
    }

    async function start() {
      const query = new URLSearchParams(location.search);
      const code = query.get("code");

      if (code) {
        try {
          await exchangeAuthorizationCode(code);
        } catch (error) {
          showSetup(error.message);
          setupStatus.classList.add("error");
          return;
        }
      }

      accessToken = await getAccessToken();

      if (!accessToken) {
        showSetup(
          "Connect this browser to Home Assistant once. " +
          "If Mousie was already authorized here, Moo Moo will normally reuse it automatically."
        );
        return;
      }

      if (!localStorage.getItem(ORS_STORAGE)) {
        showSetup(
          "Home Assistant is connected. Paste and save your HeiGIT/openrouteservice key once."
        );
        return;
      }

      try {
        await loadInitialState();
        connectWebSocket();
      } catch (error) {
        console.error(error);
        showSetup(error.message);
        setupStatus.classList.add("error");
      }
    }

    document.getElementById("save-key").addEventListener("click", () => {
      const key = orsInput.value.trim();

      if (!key) {
        setSetupStatus("Paste your routing API key first.", true);
        return;
      }

      localStorage.setItem(ORS_STORAGE, key);
      setSetupStatus("Routing key saved. Reloading…");
      setTimeout(() => location.reload(), 300);
    });

    document.getElementById("connect-ha").addEventListener("click", startAuthorization);

    document.getElementById("reset-auth").addEventListener("click", () => {
      localStorage.removeItem(AUTH_STORAGE);
      setSetupStatus("Moo Moo Home Assistant authorization removed.");
    });

    gear.addEventListener("click", () => {
      showSetup("Settings for this browser.");
      orsInput.value = localStorage.getItem(ORS_STORAGE) || "";
    });

    start();
  </script>
</body>
</html>
