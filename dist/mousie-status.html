<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mousie Status</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css">
  <style>
    :root{color-scheme:dark;--bg:#111;--fg:#fff;--muted:#b8b8b8;--panel:#1b1b1b;--border:#3a3a3a;--accent:#4b8cff;--danger:#ff7b72}
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg)}
    button,input{font:inherit}
    #loading-screen{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:var(--bg);font-size:clamp(28px,4vw,44px);font-weight:700;text-align:center}
    #loading-screen.hidden{display:none}
    #page{width:100vw;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden;background:var(--bg)}
    #header{display:none;background:var(--bg);color:var(--fg);text-align:center;padding:max(12px,env(safe-area-inset-top)) 16px 14px;z-index:5}
    #title,#eta{margin:0;font-size:clamp(34px,5.4vw,62px);font-weight:800;line-height:1.08}
    #eta{margin-top:8px}
    #map-wrap{position:relative;min-height:0;overflow:hidden;display:none}
    #map{position:absolute;inset:0}
    #home-screen{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:var(--bg);text-align:center;z-index:20}
    #home-screen .home-title{font-size:clamp(48px,8vw,96px);line-height:1.08;font-weight:800}
    #setup-screen{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:var(--bg);z-index:80}
    #setup{width:min(680px,100%);padding:26px;border:1px solid var(--border);border-radius:18px;background:var(--panel)}
    #setup h1{margin:0 0 10px;font-size:34px} #setup p{margin:0 0 18px;color:var(--muted);font-size:18px;line-height:1.45}
    #setup label{display:block;margin:16px 0 7px;font-size:18px;font-weight:700}
    #setup input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;background:#101010;color:var(--fg);font-size:18px}
    .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    button{padding:12px 17px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer} button.secondary{background:#333}
    #setup-status{margin-top:16px;color:var(--muted);font-size:16px;line-height:1.4;min-height:23px} #setup-status.error{color:var(--danger)}
    #map-status{display:none;position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:10;max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.78);color:#fff;font-size:18px;font-weight:700;text-align:center}
    #map-status.show{display:block}
    .car-marker{width:64px;height:64px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
    .destination-marker{font-size:42px;line-height:1;user-select:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
    #gear{position:fixed;right:12px;top:12px;z-index:120;width:42px;height:42px;padding:0;display:none;place-items:center;border-radius:50%;background:rgba(0,0,0,.55);color:white;font-size:22px}
  </style>
</head>
<body>
  <div id="loading-screen">🐭 Loading Mousie…</div>
  <button id="gear" title="Mousie page settings">⚙️</button>
  <div id="page">
    <header id="header"><div id="title"></div><div id="eta"></div></header>
    <main id="map-wrap"><div id="map"></div><div id="map-status"></div></main>
  </div>
  <div id="home-screen"><div class="home-title">🐭 Mousie is home</div></div>
  <div id="setup-screen"><div id="setup">
    <h1>🐭 Mousie Status Setup</h1>
    <p>One-time setup for this browser. After setup, this screen stays hidden and the page opens directly to Mousie's status.</p>
    <label for="ors-key">HeiGIT / openrouteservice API key</label>
    <input id="ors-key" type="password" autocomplete="off" placeholder="Paste ORS API key">
    <div class="buttons">
      <button id="save-key" type="button">Save routing key</button>
      <button id="connect-ha" type="button">Connect Home Assistant</button>
      <button id="reset-auth" class="secondary" type="button">Reset HA authorization</button>
    </div>
    <div id="setup-status"></div>
  </div></div>

  <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
  <script>
    const ENTITIES={location:"device_tracker.tesla_location",routeLocation:"device_tracker.tesla_active_route_location",destinationName:"sensor.tesla_active_route_destination",eta:"sensor.mousie_eta_minutes",home:"zone.home"};
    const ORS_URL="https://api.heigit.org/openrouteservice/v2/directions/driving-car/geojson";
    const MAP_STYLE="https://tiles.openfreemap.org/styles/liberty";
    const AUTH_STORAGE="hacsMousieStatusHaAuth",ORS_STORAGE="mousieStatusOrsKey";
    const CLIENT_ID=location.origin+location.pathname,REDIRECT_URI=CLIENT_ID;
    let launcherBackArmed=false;

    function armBackToLauncher(){
      if(launcherBackArmed) return;

      // Create one WebView history entry so Fully's Back button has
      // something to go back from.
      history.pushState({mousie_status:true},"",location.href);
      launcherBackArmed=true;

      window.addEventListener("popstate",()=>{
        window.location.href="fully://launcher";
      },{once:true});
    }

    const ROUTE_REFRESH_MIN_MS=60000,ROUTE_REFRESH_MOVE_METERS=300;

    const loadingScreen=document.getElementById("loading-screen"),setupScreen=document.getElementById("setup-screen"),homeScreen=document.getElementById("home-screen"),header=document.getElementById("header"),mapWrap=document.getElementById("map-wrap"),titleEl=document.getElementById("title"),etaEl=document.getElementById("eta"),setupStatusEl=document.getElementById("setup-status"),mapStatusEl=document.getElementById("map-status"),orsInput=document.getElementById("ors-key"),gear=document.getElementById("gear");

    let accessToken=null,states=new Map(),destinationTrackerId=null,map=null,mapLoaded=false,carMarker=null,destinationMarker=null,destinationMarkerName=null,currentView=null,lastRouteRequestAt=0,lastRouteOrigin=null,lastRouteDestination=null,routeRequestInFlight=false,routeAbortController=null,routeGeneration=0,ws=null,wsReconnectTimer=null;
    orsInput.value=localStorage.getItem(ORS_STORAGE)||"";

    const hideLoading=()=>loadingScreen.classList.add("hidden");
    function setSetupStatus(m,e=false){setupStatusEl.textContent=m||"";setupStatusEl.classList.toggle("error",e)}
    function setMapStatus(m){mapStatusEl.textContent=m||"";mapStatusEl.classList.toggle("show",Boolean(m))}
    function readAuth(){try{return JSON.parse(localStorage.getItem(AUTH_STORAGE)||"null")}catch(_){return null}}
    function saveAuth(a){localStorage.setItem(AUTH_STORAGE,JSON.stringify(a))} function clearAuth(){localStorage.removeItem(AUTH_STORAGE)}

    async function exchangeAuthorizationCode(code){const body=new URLSearchParams({grant_type:"authorization_code",code,client_id:CLIENT_ID});const r=await fetch("/auth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(!r.ok)throw new Error(`HA authorization failed (${r.status})`);const t=await r.json();saveAuth({access_token:t.access_token,refresh_token:t.refresh_token,expires_at:Date.now()+t.expires_in*1000});history.replaceState({},"",REDIRECT_URI)}
    async function refreshAccessToken(a){if(!a?.refresh_token)return null;const body=new URLSearchParams({grant_type:"refresh_token",refresh_token:a.refresh_token,client_id:CLIENT_ID});const r=await fetch("/auth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(!r.ok){clearAuth();return null}const d=await r.json(),u={...a,access_token:d.access_token,expires_at:Date.now()+d.expires_in*1000};saveAuth(u);return u}
    async function getAccessToken(){let a=readAuth();if(!a)return null;a=await refreshAccessToken(a);return a?.access_token||null}
    function startAuthorization(){const u=new URL("/auth/authorize",location.origin);u.searchParams.set("client_id",CLIENT_ID);u.searchParams.set("redirect_uri",REDIRECT_URI);u.searchParams.set("state","mousie-status");location.href=u.toString()}
    async function getAllStates(){const r=await fetch("/api/states",{cache:"no-store",headers:{Authorization:`Bearer ${accessToken}`,"Content-Type":"application/json"}});if(!r.ok)throw new Error(`Could not read HA states (HTTP ${r.status})`);return r.json()}

    function numeric(v){const n=Number(v);return Number.isFinite(n)?n:null}
    function stateIsUsable(v){const s=String(v??"").trim();return s!==""&&!['unknown','unavailable','none','null'].includes(s.toLowerCase())}
    function latLonFromState(s){if(!s)return null;const lat=numeric(s.attributes?.latitude),lon=numeric(s.attributes?.longitude);return lat===null||lon===null?null:{lat,lon}}
    function distanceMeters(a,b,c,d){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(c-a),dLon=rad(d-b),x=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
    function isMousieHome(){const l=states.get(ENTITIES.location),h=states.get(ENTITIES.home);if(!l||!h)return false;if(String(l.state).trim().toLowerCase()==="home")return true;const car=latLonFromState(l),home=latLonFromState(h),radius=numeric(h.attributes?.radius)??100;if(!car||!home)return false;return distanceMeters(car.lat,car.lon,home.lat,home.lon)<=radius}
    function destinationName(){const s=states.get(ENTITIES.destinationName);return stateIsUsable(s?.state)?String(s.state).trim():null}
    function etaMinutes(){const n=numeric(states.get(ENTITIES.eta)?.state);return n===null?null:Math.ceil(n)}
    function discoverDestinationTracker(all){
      if(states.has(ENTITIES.routeLocation)) return ENTITIES.routeLocation;
      for(const id of ["device_tracker.tesla_destination_location","device_tracker.tesla_destination_location_tracker"]){
        if(states.has(id)) return id;
      }
      const f=all.find(i=>{
        if(!i.entity_id.startsWith("device_tracker.")||i.entity_id===ENTITIES.location)return false;
        const t=(i.entity_id+" "+String(i.attributes?.friendly_name||"")).toLowerCase();
        return t.includes("tesla")&&(t.includes("destination")||t.includes("active_route"));
      });
      return f?.entity_id||null
    }
    function destinationCoordinates(){
      const dest=destinationName();
      if(!dest) return null;

      const routeState=states.get(ENTITIES.routeLocation) ||
        (destinationTrackerId ? states.get(destinationTrackerId) : null);

      // A missing/unavailable route tracker means Tesla is not currently
      // publishing an active navigation destination. Never use stale coords.
      if(!routeState || !stateIsUsable(routeState.state)) return null;

      const routeCoords=latLonFromState(routeState);

      // For Home, use zone.home for the exact destination, but only after
      // the active-route tracker confirms there is a live route.
      if(dest.trim().toLowerCase()==="home"){
        if(!routeCoords && String(routeState.state).trim().toLowerCase()!=="home") return null;
        return latLonFromState(states.get(ENTITIES.home));
      }

      return routeCoords;
    }

    function showSetup(m=""){hideLoading();homeScreen.style.display="none";header.style.display="none";mapWrap.style.display="none";setupScreen.style.display="grid";gear.style.display="none";setSetupStatus(m);currentView="setup"}
    function showHome(){invalidateRoute();hideLoading();setupScreen.style.display="none";header.style.display="none";mapWrap.style.display="none";homeScreen.style.display="grid";gear.style.display="grid";currentView="home"}
    function showMapLayout(t,e=""){hideLoading();setupScreen.style.display="none";homeScreen.style.display="none";titleEl.textContent=t;etaEl.textContent=e;etaEl.style.display=e?"block":"none";header.style.display="block";mapWrap.style.display="block";gear.style.display="grid"}

    function destinationElement(dest){const el=document.createElement("div");el.className="destination-marker";el.textContent=dest&&dest.toLowerCase()==="home"?"🏠":"📍";return el}

    function ensureMap(center,zoom=14){if(map)return map;map=new maplibregl.Map({container:"map",style:MAP_STYLE,center,zoom,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");map.on("load",async()=>{mapLoaded=true;map.resize();await renderStatus(true)});return map}
    function resetMapLayers(){if(!map||!mapLoaded)return;if(map.getLayer("route-line"))map.removeLayer("route-line");if(map.getLayer("route-outline"))map.removeLayer("route-outline");if(map.getSource("route"))map.removeSource("route")}
    function updateCarMarker(car){if(!map||!car)return;if(!carMarker){carMarker=new maplibregl.Marker({element:greyCarElement(),anchor:"center"}).setLngLat([car.lon,car.lat]).addTo(map)}else carMarker.setLngLat([car.lon,car.lat])}
    function updateDestinationMarker(dest,coords){if(!map)return;if(!dest||!coords){if(destinationMarker){destinationMarker.remove();destinationMarker=null;destinationMarkerName=null}return}if(!destinationMarker||destinationMarkerName!==dest){if(destinationMarker)destinationMarker.remove();destinationMarker=new maplibregl.Marker({element:destinationElement(dest),anchor:"bottom"}).setLngLat([coords.lon,coords.lat]).addTo(map);destinationMarkerName=dest}else destinationMarker.setLngLat([coords.lon,coords.lat])}

    function invalidateRoute(){
      routeGeneration++;
      if(routeAbortController){
        try{routeAbortController.abort()}catch(_){}
        routeAbortController=null;
      }
      routeRequestInFlight=false;
      lastRouteRequestAt=0;
      lastRouteOrigin=null;
      lastRouteDestination=null;
      resetMapLayers();
      updateDestinationMarker(null,null);
      setMapStatus("");
    }

    async function requestRoute(car,dest,signal){const key=localStorage.getItem(ORS_STORAGE);if(!key)throw new Error("No routing key saved. Tap ⚙️ to add it.");const r=await fetch(ORS_URL,{method:"POST",cache:"no-store",signal,headers:{Authorization:key,"Content-Type":"application/json"},body:JSON.stringify({coordinates:[[car.lon,car.lat],[dest.lon,dest.lat]]})});if(!r.ok){const d=await r.text().catch(()=>"");throw new Error(`Route API HTTP ${r.status}`+(d?`: ${d.substring(0,140)}`:""))}const g=await r.json();if(!g.features?.length)throw new Error("No driving route returned");return g.features[0].geometry}
    function drawRoute(geometry,fit=false){if(!map||!mapLoaded)return;resetMapLayers();map.addSource("route",{type:"geojson",data:{type:"Feature",properties:{},geometry}});map.addLayer({id:"route-outline",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#fff","line-width":10,"line-opacity":.9}});map.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#2878ff","line-width":7}});if(fit){const b=new maplibregl.LngLatBounds();geometry.coordinates.forEach(c=>b.extend(c));map.fitBounds(b,{padding:{top:45,bottom:45,left:45,right:45},maxZoom:15,duration:0})}}
    function routeNeedsRefresh(car,dest,force=false){if(force||!lastRouteOrigin||!lastRouteDestination)return true;if(distanceMeters(dest.lat,dest.lon,lastRouteDestination.lat,lastRouteDestination.lon)>30)return true;const moved=distanceMeters(car.lat,car.lon,lastRouteOrigin.lat,lastRouteOrigin.lon),old=Date.now()-lastRouteRequestAt>=ROUTE_REFRESH_MIN_MS;return old&&moved>=ROUTE_REFRESH_MOVE_METERS}
    async function refreshRouteIfNeeded(car,dest,force=false){
      if(!mapLoaded||routeRequestInFlight||!routeNeedsRefresh(car,dest,force)) return;

      const generation=routeGeneration;
      const controller=new AbortController();
      routeAbortController=controller;
      routeRequestInFlight=true;
      setMapStatus("Updating route…");

      try{
        const geom=await requestRoute(car,dest,controller.signal);

        // If navigation ended/changed while ORS was responding, discard it.
        if(generation!==routeGeneration || currentView!=="route") return;

        const fit=force||!lastRouteDestination||
          distanceMeters(dest.lat,dest.lon,lastRouteDestination.lat,lastRouteDestination.lon)>30;

        drawRoute(geom,fit);
        lastRouteRequestAt=Date.now();
        lastRouteOrigin={...car};
        lastRouteDestination={...dest};
        setMapStatus("");
      }catch(e){
        if(e?.name==="AbortError") return;
        console.error(e);
        if(generation===routeGeneration && currentView==="route") setMapStatus(e.message);
      }finally{
        if(routeAbortController===controller) routeAbortController=null;
        if(generation===routeGeneration) routeRequestInFlight=false;
      }
    }

    function showCurrentLocation(car){
      invalidateRoute();
      showMapLayout("🐭 Mousie's current location","");
      const m=ensureMap([car.lon,car.lat],14);
      updateCarMarker(car);
      if(mapLoaded) m.jumpTo({center:[car.lon,car.lat],zoom:14});
      currentView="location";
    }
    function showActiveRoute(car,dest,destCoords,eta){showMapLayout(`🐭 Mousie → ${dest}`,eta===null?"🕒 ETA unavailable":`🕒 ETA: ${eta} minutes`);ensureMap([car.lon,car.lat],12);updateCarMarker(car);updateDestinationMarker(dest,destCoords);const entering=currentView!=="route";currentView="route";refreshRouteIfNeeded(car,destCoords,entering)}

    async function renderStatus(forceRoute=false){const car=latLonFromState(states.get(ENTITIES.location));if(!car){setMapStatus("Mousie's location is unavailable");return}if(isMousieHome()){showHome();return}const dest=destinationName(),destCoords=destinationCoordinates(),eta=etaMinutes();if(dest&&destCoords){showActiveRoute(car,dest,destCoords,eta);if(forceRoute)await refreshRouteIfNeeded(car,destCoords,true);return}showCurrentLocation(car)}
    async function loadInitialStates(){const all=await getAllStates();all.forEach(i=>states.set(i.entity_id,i));destinationTrackerId=discoverDestinationTracker(all);await renderStatus(true)}

    function websocketUrl(){return `${location.protocol==="https:"?"wss:":"ws:"}//${location.host}/api/websocket`}
    async function connectWebSocket(){if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null}ws=new WebSocket(websocketUrl());let id=1;ws.addEventListener("message",async ev=>{const m=JSON.parse(ev.data);if(m.type==="auth_required"){const t=await getAccessToken();if(!t){ws.close();showSetup("Home Assistant authorization expired. Reconnect once.");return}accessToken=t;ws.send(JSON.stringify({type:"auth",access_token:t}));return}if(m.type==="auth_ok"){ws.send(JSON.stringify({id:id++,type:"subscribe_events",event_type:"state_changed"}));return}if(m.type==="auth_invalid"){clearAuth();ws.close();showSetup("Home Assistant authorization expired. Reconnect once.");return}if(m.type!=="event")return;const d=m.event?.data,e=d?.entity_id,n=d?.new_state;if(!e)return;if(n)states.set(e,n);else states.delete(e);if(e===ENTITIES.routeLocation){destinationTrackerId=ENTITIES.routeLocation}else if(!states.has(ENTITIES.routeLocation)&&e.startsWith("device_tracker.")&&e!==ENTITIES.location){const txt=(e+" "+String(n?.attributes?.friendly_name||"")).toLowerCase();if(txt.includes("tesla")&&(txt.includes("destination")||txt.includes("active_route")))destinationTrackerId=e}const relevant=new Set([ENTITIES.location,ENTITIES.routeLocation,ENTITIES.destinationName,ENTITIES.eta,ENTITIES.home,destinationTrackerId]);if(relevant.has(e))await renderStatus(false)});ws.addEventListener("close",()=>{wsReconnectTimer=setTimeout(connectWebSocket,5000)});ws.addEventListener("error",()=>{try{ws.close()}catch(_) {}})}

    async function start(){const q=new URLSearchParams(location.search),code=q.get("code");if(code){try{await exchangeAuthorizationCode(code)}catch(e){showSetup(e.message);setupStatusEl.classList.add("error");return}}accessToken=await getAccessToken();if(!accessToken){showSetup("Connect this browser to Home Assistant once. After setup, this screen will no longer appear during normal loading.");return}if(!localStorage.getItem(ORS_STORAGE)){showSetup("Home Assistant is connected. Paste and save your HeiGIT/openrouteservice key once.");return}try{await loadInitialStates();armBackToLauncher();connectWebSocket()}catch(e){console.error(e);showSetup(e.message);setupStatusEl.classList.add("error")}}

    document.getElementById("save-key").addEventListener("click",()=>{const k=orsInput.value.trim();if(!k){setSetupStatus("Paste your routing API key first.",true);return}localStorage.setItem(ORS_STORAGE,k);setSetupStatus("Routing key saved. Reloading…");setTimeout(()=>location.reload(),300)});
    document.getElementById("connect-ha").addEventListener("click",startAuthorization);
    document.getElementById("reset-auth").addEventListener("click",()=>{clearAuth();setSetupStatus("Home Assistant authorization removed from this browser.")});
    gear.addEventListener("click",()=>{showSetup("Settings for this browser.");orsInput.value=localStorage.getItem(ORS_STORAGE)||""});
    start();
  </script>
</body>
</html>
